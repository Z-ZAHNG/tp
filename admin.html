<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员后台 · eszytp</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f7;color:#222;}
  header{background:#2b2f3a;color:#fff;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;}
  header .t{font-size:18px;font-weight:800;}
  header button{background:transparent;border:1px solid #6b7180;color:#fff;padding:7px 16px;border-radius:18px;cursor:pointer;font-size:14px;}
  .wrap{max-width:960px;margin:24px auto;padding:0 16px;}
  .login{max-width:380px;margin:90px auto;background:#fff;border-radius:16px;padding:34px 30px;box-shadow:0 6px 24px rgba(0,0,0,.08);}
  .login h2{text-align:center;margin-bottom:22px;}
  .login input{width:100%;padding:12px 14px;border:1px solid #dfe2ea;border-radius:10px;font-size:15px;margin-bottom:16px;}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn.primary{background:#ff5a3c;color:#fff;width:100%;}
  .btn.small{padding:6px 12px;font-size:13px;border-radius:8px;}
  .btn.danger{background:#f2f3f7;color:#e0392b;} .btn.danger:hover{background:#ffe5e1;}
  .btn.warn{background:#f2f3f7;color:#d98400;} .btn.warn:hover{background:#fff3dd;}
  .btn.blue{background:#2f7ef5;color:#fff;}
  .card{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .card h3{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:10px 8px;border-bottom:1px solid #eef0f4;text-align:left;font-size:14px;vertical-align:middle;}
  th{color:#8a90a2;font-weight:600;font-size:13px;}
  td img{width:46px;height:46px;border-radius:10px;object-fit:cover;}
  td input{width:120px;padding:6px 8px;border:1px solid #dfe2ea;border-radius:8px;font-size:14px;}
  td input.title{width:130px;}
  .msg-row td:nth-child(2){max-width:420px;}
  .msg-content{word-break:break-word;line-height:1.5;}
  .muted{color:#8a90a2;font-size:12px;}
  .hidden{display:none;}
  #toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:999;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="t">🛠️ 投票网站 · 管理员后台</div>
  <button id="logoutBtn" class="hidden">退出登录</button>
</header>

<!-- 登录 -->
<div class="login" id="loginBox">
  <h2>管理员登录</h2>
  <input id="pwd" type="password" placeholder="请输入管理员密码">
  <button class="btn primary" id="loginBtn">登 录</button>
</div>

<!-- 管理面板 -->
<div class="wrap hidden" id="panel">
  <div class="card">
    <h3>候选人 / 投票管理
      <button class="btn warn small" id="resetAll">全部票数清零</button>
    </h3>
    <table>
      <thead><tr><th>照片</th><th>称号</th><th>票数</th><th style="width:250px">操作</th></tr></thead>
      <tbody id="candBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>广场留言管理</h3>
    <table>
      <thead><tr><th>昵称</th><th>留言内容</th><th>时间</th><th>操作</th></tr></thead>
      <tbody id="msgBody"></tbody>
    </table>
  </div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={candidates:[],messages:[]};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2000);}
async function api(url,data){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})});
  let d; try{d=await r.json();}catch(e){d={ok:false,msg:'请求失败'};}
  if(r.status===401){ showLogin(); }
  return d;
}
function showLogin(){ $('#loginBox').classList.remove('hidden'); $('#panel').classList.add('hidden'); $('#logoutBtn').classList.add('hidden'); }
function showPanel(){ $('#loginBox').classList.add('hidden'); $('#panel').classList.remove('hidden'); $('#logoutBtn').classList.remove('hidden'); load(); }

$('#loginBtn').addEventListener('click',async()=>{
  const d=await api('/api/admin/login',{password:$('#pwd').value});
  if(d.ok){ toast('登录成功'); showPanel(); } else toast(d.msg||'密码错误');
});
$('#pwd').addEventListener('keydown',e=>{ if(e.key==='Enter')$('#loginBtn').click(); });
$('#logoutBtn').addEventListener('click',async()=>{ await api('/api/admin/logout',{}); showLogin(); });

async function load(){
  const r=await fetch('/api/state'); state=await r.json();
  state.candidates.sort((a,b)=>b.votes-a.votes||a.id-b.id);
  state.messages.sort((a,b)=>b.id-a.id);
  renderCands(); renderMsgs();
}
function renderCands(){
  $('#candBody').innerHTML = state.candidates.length ? state.candidates.map(c=>`
    <tr data-id="${c.id}">
      <td><img src="/uploads/${esc(c.image)}"></td>
      <td><input class="title" value="${esc(c.title)}"></td>
      <td><input class="votes" type="number" min="0" value="${c.votes}"></td>
      <td>
        <button class="btn blue small act-save">保存</button>
        <button class="btn warn small act-reset">清零</button>
        <button class="btn danger small act-del">删除</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">暂无候选人</td></tr>';
}
function renderMsgs(){
  $('#msgBody').innerHTML = state.messages.length ? state.messages.map(m=>`
    <tr class="msg-row" data-id="${m.id}">
      <td>${esc(m.name)}</td>
      <td><div class="msg-content">${esc(m.content)}</div></td>
      <td class="muted">${esc(m.time)}</td>
      <td><button class="btn danger small m-del">删除</button></td>
    </tr>`).join('') : '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">暂无留言</td></tr>';
}

$('#candBody').addEventListener('click',async e=>{
  const tr=e.target.closest('tr'); if(!tr)return; const id=Number(tr.dataset.id);
  if(e.target.classList.contains('act-save')){
    const title=tr.querySelector('.title').value.trim();
    const votes=Number(tr.querySelector('.votes').value);
    const d=await api('/api/admin/candidate/update',{id,title,votes});
    if(d.ok){toast('已保存');load();}else toast(d.msg||'保存失败');
  }
  if(e.target.classList.contains('act-reset')){
    const d=await api('/api/admin/votes/reset',{id});
    if(d.ok){toast('该候选人票数已清零');load();}
  }
  if(e.target.classList.contains('act-del')){
    if(!confirm('确定删除该候选人及其照片吗？'))return;
    const d=await api('/api/admin/candidate/delete',{id});
    if(d.ok){toast('已删除');load();}else toast(d.msg||'删除失败');
  }
});
$('#msgBody').addEventListener('click',async e=>{
  if(!e.target.classList.contains('m-del'))return;
  const tr=e.target.closest('tr'); const id=Number(tr.dataset.id);
  if(!confirm('确定删除这条不友好留言吗？'))return;
  const d=await api('/api/admin/message/delete',{id});
  if(d.ok){toast('留言已删除');load();}else toast(d.msg||'删除失败');
});
$('#resetAll').addEventListener('click',async()=>{
  if(!confirm('确定将所有候选人票数清零吗？'))return;
  const d=await api('/api/admin/votes/reset',{});
  if(d.ok){toast('全部票数已清零');load();}
});

// 探测登录态：尝试拉数据（公开接口无法判断），直接显示登录框
showLogin();
setInterval(()=>{ if(!$('#panel').classList.contains('hidden')) load(); },3000);
</script>
</body>
</html>
